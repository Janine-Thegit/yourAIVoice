<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Milton — Techie TC</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="favicon-180.png" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:   #7B9EC4;
      --neutral:   #1A1D23;
      --text:      #E8EAF0;
      --text-soft: rgba(232,234,240,0.55);
      --border:    rgba(232,234,240,0.10);
      --surface:   #22262E;
      --surface-2: #2A2F3A;
      --success:   #7A9E87;
      --error:     #C4897A;
    }

    body {
      background: var(--neutral);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 16px;
      line-height: 1.7;
      min-height: 100vh;
    }

    .brand-header {
      position: fixed;
      top: 28px;
      left: 32px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-header span {
      font-family: 'Cormorant Garamond', serif;
      font-size: 19px;
      font-weight: 300;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 48px;
      max-width: 480px;
      width: 100%;
    }

    .product-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .product-tag img { width: 14px; height: 14px; }

    .product-tag span {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--primary);
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 300;
      line-height: 1.15;
      color: var(--text);
      margin-bottom: 12px;
    }

    h1 em { font-style: italic; color: var(--primary); }

    .subtitle {
      font-size: 15px;
      color: var(--text-soft);
      margin-bottom: 32px;
      line-height: 1.65;
    }

    .btn {
      display: inline-block;
      padding: 13px 28px;
      background: var(--primary);
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      transition: opacity 0.2s;
      width: 100%;
      text-align: center;
    }

    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .message {
      padding: 14px 18px;
      border-radius: 3px;
      font-size: 14px;
      margin-bottom: 24px;
      display: none;
    }

    .message.error {
      background: color-mix(in srgb, var(--error) 12%, white);
      border: 1px solid var(--error);
      color: var(--text);
    }

    .message.visible { display: block; }

    .back-link {
      display: block;
      margin-top: 20px;
      color: var(--primary);
      text-decoration: none;
      font-size: 13px;
      text-align: center;
    }

    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<header class="brand-header">
  <span>Techie TC</span>
</header>

<div class="screen">
  <div class="card">
    <div class="product-tag">
      <img src="favicon.svg" alt="Milton" />
      <span>Milton</span>
    </div>
    <h1>One Last <em>Click</em></h1>
    <p class="subtitle">
      For security, this link only signs you in once you click below.
      That way, if anything opens the email link before you do, it can't
      use up your sign-in on your behalf.
    </p>

    <div id="confirm-message" class="message"></div>

    <button class="btn" id="confirm-btn">Sign in</button>
    <a class="back-link" id="back-link" href="landing.html">Request a new link instead</a>
  </div>
</div>

<script>
  function showMessage(text) {
    const el = document.getElementById('confirm-message')
    el.className = 'message error visible'
    el.textContent = text
  }

  // The email template hands us a bare token, not a full URL -- Supabase's
  // Go templates mangle a full URL-shaped value wrapped inside another URL,
  // so we build the real Supabase verification URL ourselves here instead,
  // where the encoding is fully under our control.
  const params = new URLSearchParams(window.location.search)
  const tokenHash = params.get('token_hash')
  const type = params.get('type') || 'magiclink'

  const SUPABASE_URL = 'https://wubukfrhdgexbppqanaw.supabase.co'
  const REDIRECT_TO = new URL('index.html', window.location.href).toString()

  const btn = document.getElementById('confirm-btn')

  if (!tokenHash) {
    btn.disabled = true
    btn.textContent = 'Link unavailable'
    showMessage('This link looks incomplete. Please request a new one.')
  } else {
    const target = `${SUPABASE_URL}/auth/v1/verify?token=${encodeURIComponent(tokenHash)}&type=${encodeURIComponent(type)}&redirect_to=${encodeURIComponent(REDIRECT_TO)}`

    btn.addEventListener('click', () => {
      btn.disabled = true
      btn.textContent = 'Signing in...'
      window.location.href = target
    })
  }
</script>

</body>
</html>
